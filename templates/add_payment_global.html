{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> {{ t('add_new_payment') }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">{{ t('client') }} <span class="text-danger">*</span></label>
                        <select name="client_id" class="form-select" required>
                            <option value="">{{ t('choose_client') }}</option>
                            {% for client in clients %}
                            <option value="{{ client.id }}">{{ client.name }} {% if client.company_name %}({{ client.company_name }}){% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ t('module') }}</label>
                        <select name="module_id" class="form-select">
                            <option value="">{{ t('no_module') }}</option>
                            {% for module in modules %}
                            <option value="{{ module.id }}">{{ module.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ t('amount') }} <span class="text-danger">*</span></label>
                            <input type="number" name="amount" class="form-control" required step="0.01" placeholder="0.00">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ t('payment_date') }} <span class="text-danger">*</span></label>
                            <input type="date" name="payment_date" class="form-control" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ t('due_date') }}</label>
                            <input type="date" name="due_date" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ t('payment_method') }}</label>
                            <select name="payment_method" class="form-select">
                                <option value="نقدي">{{ t('cash') }}</option>
                                <option value="تحويل بنكي">{{ t('bank_transfer') }}</option>
                                <option value="شيك">{{ t('check') }}</option>
                                <option value="بطاقة ائتمان">{{ t('credit_card') }}</option>
                                <option value="أخرى">{{ t('other') }}</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ t('status') }}</label>
                            <select name="status" class="form-select">
                                <option value="مدفوع">{{ t('status_paid') }}</option>
                                <option value="معلق">{{ t('status_pending') }}</option>
                                <option value="متأخر">{{ t('status_overdue') }}</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ t('invoice_number') }}</label>
                            <input type="text" name="invoice_number" class="form-control" placeholder="INV-001">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ t('notes') }}</label>
                        <textarea name="notes" class="form-control" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-check-circle"></i> {{ t('add_payment') }}
                    </button>
                </form>
            </div>
        </div>
        <div class="mt-3">
            <a href="/all_payments" class="btn btn-secondary">
                <i class="bi bi-arrow-right"></i> {{ t('back_to_payments') }}
            </a>
        </div>
    </div>
</div>
{% endblock %}

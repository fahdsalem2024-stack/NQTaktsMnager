{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-gradient-primary text-white rounded-top-4 py-3">
                <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i> {{ t('add_new_trainer') }}</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" id="addTrainerForm">
                    <div class="section-title">
                        <i class="bi bi-info-circle me-2"></i> {{ t('trainer_info') }}
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('name') }} <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control form-control-lg" required placeholder="{{ t('enter_trainer_name') }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('phone') }}</label>
                            <input type="tel" name="phone" class="form-control form-control-lg" placeholder="0551234567">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('email') }}</label>
                            <input type="email" name="email" class="form-control form-control-lg" placeholder="example@domain.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('specialty') }}</label>
                            <input type="text" name="specialty" class="form-control form-control-lg" placeholder="{{ t('specialty_hint') }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">{{ t('notes') }}</label>
                            <textarea name="notes" class="form-control" rows="3" placeholder="{{ t('trainer_notes_hint') }}"></textarea>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success flex-grow-1 py-2">
                            <i class="bi bi-check-circle me-2"></i> {{ t('add_trainer') }}
                        </button>
                        <a href="/trainers" class="btn btn-outline-secondary py-2">
                            <i class="bi bi-arrow-right me-2"></i> {{ t('back') }}
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.bg-gradient-primary { background: linear-gradient(135deg, #1a237e, #0d47a1); }
.section-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1a237e;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid #e2e8f0;
}
.form-control-lg {
    border-radius: 12px;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
}
</style>
{% endblock %}

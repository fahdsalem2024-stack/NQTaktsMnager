{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-gradient-primary text-white rounded-top-4 py-3">
                <h4 class="mb-0"><i class="bi bi-grid me-2"></i> {{ t('add_new_module') }}</h4>
                <small class="d-block text-white-50 mt-1">{{ t('for') }}: {{ client.name }}</small>
            </div>
            <div class="card-body p-4">
                <form method="POST" id="addModuleForm">
                    <div class="section-title">
                        <i class="bi bi-info-circle me-2"></i> {{ t('module_info') }}
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <label class="form-label fw-bold">{{ t('module_name') }} <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control form-control-lg" required placeholder="{{ t('module_name_hint') }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">{{ t('description') }}</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="{{ t('module_description_hint') }}"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('module_price') }} ({{ t('currency') }})</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-currency-dollar"></i></span>
                                <input type="number" name="price" class="form-control form-control-lg" value="0" step="0.01">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('status') }}</label>
                            <select name="status" class="form-select form-select-lg">
                                <option value="نشط" selected>🟢 {{ t('status_active') }}</option>
                                <option value="قيد التطوير">🟡 {{ t('in_development') }}</option>
                                <option value="مكتمل">✅ {{ t('completed_module') }}</option>
                                <option value="متوقف">⛔ {{ t('stopped') }}</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('start_date') }}</label>
                            <input type="date" name="start_date" class="form-control form-control-lg">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('end_date') }}</label>
                            <input type="date" name="end_date" class="form-control form-control-lg">
                        </div>
                    </div>

                    <div class="card border-0 mb-4" style="background: #f0f7ff;">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <small class="text-muted d-block">{{ t('client') }}</small>
                                    <strong><i class="bi bi-person me-1"></i> {{ client.name }}</strong>
                                </div>
                                {% if client.company_name %}
                                <div class="col-md-6">
                                    <small class="text-muted d-block">{{ t('company') }}</small>
                                    <strong><i class="bi bi-building me-1"></i> {{ client.company_name }}</strong>
                                </div>
                                {% endif %}
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success flex-grow-1 py-2">
                            <i class="bi bi-check-circle me-2"></i> {{ t('add_module') }}
                        </button>
                        <a href="{{ url_for('modules.client_modules', client_id=client.id) }}" class="btn btn-outline-secondary py-2">
                            <i class="bi bi-arrow-right me-2"></i> {{ t('back') }}
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.bg-gradient-primary { background: linear-gradient(135deg, #1a237e, #0d47a1); }
.section-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1a237e;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid #e2e8f0;
}
.form-control-lg, .form-select-lg {
    border-radius: 12px;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
}
</style>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-gradient-primary text-white rounded-top-4 py-3">
                <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i> {{ t('add_new_task') }}</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" id="addTaskForm">
                    <div class="section-title">
                        <i class="bi bi-info-circle me-2"></i> {{ t('task_info') }}
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('client') }} <span class="text-danger">*</span></label>
                            <select name="client_id" class="form-select form-select-lg" required>
                                <option value="">{{ t('choose_client') }}</option>
                                {% for client in clients %}
                                <option value="{{ client.id }}">{{ client.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('responsible_trainer') }} <span class="text-danger">*</span></label>
                            <select name="assigned_to" class="form-select form-select-lg" required>
                                <option value="">{{ t('choose_trainer') }}</option>
                                {% for trainer in trainers %}
                                <option value="{{ trainer.id }}">{{ trainer.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">{{ t('task_title') }} <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">{{ t('description') }}</label>
                            <textarea name="description" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('due_date') }} <span class="text-danger">*</span></label>
                            <input type="date" name="due_date" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('priority') }}</label>
                            <select name="priority" class="form-select form-select-lg">
                                <option value="منخفضة">🟢 {{ t('priority_low') }}</option>
                                <option value="متوسطة" selected>🟡 {{ t('priority_medium') }}</option>
                                <option value="عالية">🔴 {{ t('priority_high') }}</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('meeting') }}</label>
                            <select name="meeting_id" class="form-select form-select-lg">
                                <option value="">{{ t('no_meeting') }}</option>
                                {% for meeting in meetings %}
                                <option value="{{ meeting.id }}">{{ meeting.title }} - {{ meeting.client_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('task_group') }}</label>
                            <input type="text" name="task_group" class="form-control form-control-lg" placeholder="{{ t('task_group_hint') }}">
                        </div>
                    </div>

                    <hr>

                    <div class="section-title">
                        <i class="bi bi-link me-2"></i> {{ t('link_to_payment') }}
                    </div>
                    <div class="card border-0 mb-4" style="background: #fefce8;">
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">{{ t('choose_payment') }}</label>
                                <select name="contract_payment_id" class="form-select form-select-lg">
                                    <option value="">{{ t('no_link') }}</option>
                                    {% for payment in available_payments %}
                                    <option value="{{ payment.id }}">
                                        {{ payment.contract_number }} - {{ t('payment') }} {{ payment.installment_number }} 
                                        ({{ payment.amount }} {{ t('currency') }})
                                    </option>
                                    {% endfor %}
                                </select>
                                <small class="text-muted">💡 {{ t('payment_link_hint') }}</small>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success flex-grow-1 py-2">
                            <i class="bi bi-check-circle me-2"></i> {{ t('add_task') }}
                        </button>
                        <a href="/tasks" class="btn btn-outline-secondary py-2">
                            <i class="bi bi-arrow-right me-2"></i> {{ t('back') }}
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.bg-gradient-primary { background: linear-gradient(135deg, #1a237e, #0d47a1); }
.section-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1a237e;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid #e2e8f0;
}
.form-control-lg, .form-select-lg {
    border-radius: 12px;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
}
</style>
{% endblock %}

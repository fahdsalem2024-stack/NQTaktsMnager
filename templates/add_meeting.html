{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-calendar-plus"></i> {{ t('add_new_meeting') }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">{{ t('client') }} <span class="text-danger">*</span></label>
                        <select name="client_id" class="form-select" required>
                            <option value="">{{ t('choose_client') }}</option>
                            {% for client in clients %}
                            <option value="{{ client.id }}">{{ client.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ t('meeting_title') }} <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" required placeholder="{{ t('meeting_title_hint') }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ t('description') }}</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ t('date_time') }} <span class="text-danger">*</span></label>
                            <input type="datetime-local" name="meeting_date" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ t('duration_minutes') }}</label>
                            <input type="number" name="duration" class="form-control" value="60" min="15">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ t('location') }}</label>
                        <input type="text" name="location" class="form-control" placeholder="{{ t('location_hint') }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ t('meeting_link') }}</label>
                        <input type="url" name="meeting_link" class="form-control" placeholder="https://meet.google.com/...">
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-check-circle"></i> {{ t('add_meeting') }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

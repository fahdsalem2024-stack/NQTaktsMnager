{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-gradient-warning text-white rounded-top-4 py-3">
                <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i> {{ t('edit_trainer') }}</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" id="editTrainerForm">
                    <div class="section-title">
                        <i class="bi bi-info-circle me-2"></i> {{ t('trainer_info') }}
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('name') }} <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control form-control-lg" value="{{ trainer.name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('phone') }}</label>
                            <input type="tel" name="phone" class="form-control form-control-lg" value="{{ trainer.phone or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('email') }}</label>
                            <input type="email" name="email" class="form-control form-control-lg" value="{{ trainer.email or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">{{ t('specialty') }}</label>
                            <input type="text" name="specialty" class="form-control form-control-lg" value="{{ trainer.specialty or '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">{{ t('notes') }}</label>
                            <textarea name="notes" class="form-control" rows="3">{{ trainer.notes or '' }}</textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">{{ t('status') }}</label>
                            <select name="is_active" class="form-select form-select-lg">
                                <option value="1" {% if trainer.is_active %}selected{% endif %}>{{ t('status_active') }}</option>
                                <option value="0" {% if not trainer.is_active %}selected{% endif %}>{{ t('status_inactive') }}</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary flex-grow-1 py-2">
                            <i class="bi bi-save me-2"></i> {{ t('save_changes') }}
                        </button>
                        <a href="/trainer/{{ trainer.id }}" class="btn btn-outline-secondary py-2">
                            <i class="bi bi-arrow-right me-2"></i> {{ t('back') }}
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.bg-gradient-warning { background: linear-gradient(135deg, #f57c00, #f9a825); }
.section-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1a237e;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid #e2e8f0;
}
.form-control-lg {
    border-radius: 12px;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
}
</style>
{% endblock %}
